<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stable Diffusion Progress</title>

  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: Arial, sans-serif;
      background: #171717;
      color: #f5f5f5;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    .settings,
    .card {
      background: #242424;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #bbb;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 1rem;
    }

    .progress-container {
      height: 28px;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
      margin: 1rem 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4caf50;
      transition: width 0.4s ease;
      font-weight: bold;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      text-align: center;
    }

    .stat {
      padding: 1rem 0.5rem;
      border-radius: 8px;
      background: #303030;
    }

    .stat-value {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }

    .stat-label {
      color: #aaa;
      font-size: 0.85rem;
    }

    #status {
      color: #aaa;
      margin-top: 1rem;
    }

    #error {
      color: #ff7777;
      margin-top: 0.5rem;
      white-space: pre-wrap;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      margin: 1rem auto 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Stable Diffusion Progress</h1>

    <section class="settings">
      <label for="apiUrl">Stable Diffusion API URL</label>
      <input
        id="apiUrl"
        value="http://127.0.0.1:7860"
        placeholder="http://127.0.0.1:7860"
      />
    </section>

    <section class="card">
      <div class="progress-container">
        <div id="progressBar" class="progress-bar">0%</div>
      </div>

      <div class="stats">
        <div class="stat">
          <span id="overallPercent" class="stat-value">0%</span>
          <span class="stat-label">Overall progress</span>
        </div>

        <div class="stat">
          <span id="completedImages" class="stat-value">0</span>
          <span class="stat-label">Images completed</span>
        </div>

        <div class="stat">
          <span id="totalImages" class="stat-value">0</span>
          <span class="stat-label">Total images</span>
        </div>
      </div>

      <div id="status">Waiting for generation...</div>
      <div id="error"></div>

      <img id="previewImage" alt="Current Stable Diffusion preview" hidden />
    </section>
  </main>

  <script>
    const apiUrlInput = document.getElementById("apiUrl");
    const progressBar = document.getElementById("progressBar");
    const overallPercent = document.getElementById("overallPercent");
    const completedImages = document.getElementById("completedImages");
    const totalImages = document.getElementById("totalImages");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const previewImage = document.getElementById("previewImage");

    // Load saved API URL from localStorage on startup
    const SAVED_API_URL_KEY = "sd_progress_api_url";
    const savedUrl = localStorage.getItem(SAVED_API_URL_KEY);
    if (savedUrl !== null) {
      apiUrlInput.value = savedUrl;
    }

    function getApiUrl() {
      return apiUrlInput.value.trim().replace(/\/+$/, "");
    }

    function setProgress(percent) {
      const safePercent = Math.max(0, Math.min(100, percent));
      const roundedPercent = Math.round(safePercent);

      progressBar.style.width = `${safePercent}%`;
      progressBar.textContent = `${roundedPercent}%`;
      overallPercent.textContent = `${roundedPercent}%`;
    }

    function base64ToDataUrl(base64) {
      if (!base64) return "";
      return base64.startsWith("data:image")
        ? base64
        : `data:image/jpeg;base64,${base64}`;
    }

    async function updateProgress() {
      try {
        const response = await fetch(
          `${getApiUrl()}/sdapi/v1/progress?skip_current_image=false`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const progress = Number(data.progress || 0);
        const state = data.state || {};

        const jobNumber = Number(state.job_no || 0);
        const jobCount = Number(state.job_count || 0);

        let completed = jobNumber;
        let overall = progress * 100;

        if (jobCount > 0) {
          overall = ((jobNumber + progress) / jobCount) * 100;
          completed = Math.min(jobNumber, jobCount);
        }

        setProgress(overall);
        completedImages.textContent = completed;
        totalImages.textContent = jobCount || "—";

        if (progress > 0 || jobCount > 0) {
          status.textContent = jobCount > 0
            ? `Generating image ${Math.min(jobNumber + 1, jobCount)} of ${jobCount}`
            : "Generating...";
        } else {
          status.textContent = "Idle";
        }

        if (data.current_image) {
          previewImage.src = base64ToDataUrl(data.current_image);
          previewImage.hidden = false;
        } else {
          previewImage.hidden = true;
        }

        errorBox.textContent = "";
      } catch (error) {
        status.textContent = "Unable to connect";
        errorBox.textContent =
          `Could not reach ${getApiUrl()}.\n` +
          `Check that Stable Diffusion is running and that CORS is enabled.\n\n` +
          error.message;
      }
    }

    // Save API URL to localStorage whenever the user changes or types in it
    apiUrlInput.addEventListener("input", () => {
      localStorage.setItem(SAVED_API_URL_KEY, apiUrlInput.value);
      updateProgress();
    });

    apiUrlInput.addEventListener("change", updateProgress);

    // Initial request, then refresh every 2 seconds.
    updateProgress();
    setInterval(updateProgress, 2000);
  </script>
</body>
</html>
