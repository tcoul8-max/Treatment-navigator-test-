<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Automatic1111 Progress Monitor</title>
    <style>
        /* Base Reset & Pitch Black Screen */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Minimalist Add Button in Top Right */
        #add-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            font-weight: 200;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s ease, transform 0.2s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        #add-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        /* Main Container centered on display */
        #monitor-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Instance Layout */
        .instance-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        /* Header containing IP text and % readout */
        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .ip-display {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.05em;
            opacity: 0.5;
        }
        .percentage-display {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* Minimalist Progress Bar Track */
        .progress-track {
            width: 100%;
            height: 3px;
            background-color: #222222;
            border-radius: 2px;
            overflow: hidden;
        }
        /* White Progress Indicator */
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        /* Context Subtext (e.g., Offline/Idle status) */
        .status-subtext {
            font-size: 11px;
            font-weight: 300;
            opacity: 0.25;
            text-align: right;
            margin-top: -2px;
        }

        /* Right-click or Hover Remove Button action */
        .remove-zone {
            position: absolute;
            left: -24px;
            top: 2px;
            color: #ff4444;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .instance-card:hover .remove-zone {
            opacity: 0.6;
        }
        .remove-zone:hover {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <!-- Minimalist Controls -->
    <button id="add-btn" title="Add Automatic1111 Instance">+</button>

    <!-- Center Display List -->
    <div id="monitor-container"></div>

    <script>
        const container = document.getElementById('monitor-container');
        const addBtn = document.getElementById('add-btn');
        
        // Retrieve saved instances or default to localhost if empty
        let instances = JSON.parse(localStorage.getItem('sd_tracked_ips')) || [];

        // Save layout configuration
        function saveToStorage() {
            localStorage.setItem('sd_tracked_ips', JSON.stringify(instances));
        }

        // Initialize UI Elements
        function renderInstances() {
            container.innerHTML = '';
            if (instances.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.2; font-size:13px; font-weight:300;">No instances monitored. Click + to add.</div>';
                return;
            }

            instances.forEach((ip, index) => {
                const card = document.createElement('div');
                card.className = 'instance-card';
                card.id = `node-${index}`;

                card.innerHTML = `
                    <div class="remove-zone" onclick="removeInstance(${index})" title="Remove">×</div>
                    <div class="instance-header">
                        <span class="ip-display">${ip}</span>
                        <span class="percentage-display" id="pct-${index}">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar" id="bar-${index}"></div>
                    </div>
                    <div class="status-subtext" id="status-${index}">connecting...</div>
                `;
                container.appendChild(card);
            });
        }

        // Prompt window for configuration
        addBtn.addEventListener('click', () => {
            let ipInput = prompt("Enter the Automatic1111 WebUI address:\n(e.g., 127.0.0.1:7860 or 192.168.1.50:7860)");
            if (ipInput) {
                // Ensure proper structure format
                ipInput = ipInput.trim().replace(/^(https?:\/\/)?/, '');
                if (!ipInput.includes(':')) {
                    ipInput += ':7860'; // Append standard UI port if missing
                }
                if (!instances.includes(ipInput)) {
                    instances.push(ipInput);
                    saveToStorage();
                    renderInstances();
                    fetchProgressForInstance(instances.length - 1);
                }
            }
        });

        window.removeInstance = function(index) {
            instances.splice(index, 1);
            saveToStorage();
            renderInstances();
        };

        // Async API tracking polling loop
        async function fetchProgressForInstance(index) {
            const ip = instances[index];
            if (!ip) return; // Safeguard if deleted midway

            const barEl = document.getElementById(`bar-${index}`);
            const pctEl = document.getElementById(`pct-${index}`);
            const statusEl = document.getElementById(`status-${index}`);

            if (!barEl || !pctEl || !statusEl) return;

            try {
                // Using standard http target. Adjust scheme if running strictly on SSL/HTTPS
                const response = await fetch(`http://${ip}/sdapi/v1/progress?skip_current_image=true`, {
                    method: 'GET',
                    mode: 'cors'
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                
                // Progress is returned as a float value between 0.0 and 1.0
                const rawProgress = data.progress || 0;
                const percentage = Math.round(rawProgress * 100);
                
                // Update elements dynamically
                barEl.style.width = `${percentage}%`;
                pctEl.innerText = `${percentage}%`;

                if (rawProgress > 0) {
                    const eta = data.eta_relative ? `${Math.round(data.eta_relative)}s remaining` : 'processing';
                    statusEl.innerText = eta;
                } else {
                    statusEl.innerText = 'idle';
                }

            } catch (err) {
                // Fallback gracefully on local network blocking context or closed server
                statusEl.innerText = 'offline / cors blocked';
                barEl.style.width = '0%';
                pctEl.innerText = '0%';
            }

            // Continuous polling sequence loop every 1 second
            setTimeout(() => fetchProgressForInstance(index), 1000);
        }

        // Run checking loops globally
        function initMonitor() {
            renderInstances();
            instances.forEach((_, idx) => {
                fetchProgressForInstance(idx);
            });
        }

        initMonitor();
    </script>
</body>
</html>
